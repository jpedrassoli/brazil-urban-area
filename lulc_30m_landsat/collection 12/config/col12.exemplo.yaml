# EXEMPLO de configuração — copie para config/col12.yaml (não versionado) e preencha os campos
# "seu-projeto-do-cloud". Também é possível apontar outro arquivo com a variável MB_URBAN_CONFIG.
#
# Insumos lidos de assets de terceiros (podem exigir permissão de leitura): grade hexagonal de cartas
# (grids.cartas_hex), imagem de limiares (postprocess.threshold_image), máscara espacial
# (postprocess.spatial_mask), índice de infraestrutura (postprocess.irs_asset) e as grades de
# exportação (postprocess.cartas_export, postprocess.cartas_hex).

# MapBiomas Coleção 12 — Áreas Urbanizadas (Landsat 30 m)
# Configuração central. Os scripts leem TUDO daqui: nada de comentar/descomentar código.

collection: 12
years: [1985, 2025]          # intervalo inclusivo; atualize o ano final quando houver novo ano

# Projeto do Google Cloud usado pelo Earth Engine (cotas e faturamento)
cloud_project: seu-projeto-do-cloud   # projeto do Google Cloud registrado no Earth Engine

# Prefixo do nome de toda tarefa enviada, para identificar no painel de tarefas de um projeto compartilhado
task_prefix: urban_col12_

# Contas do Earth Engine. Cada uma roda até `max_concurrent` tarefas ao mesmo tempo.
# `credentials` é o arquivo salvo por `python -m mb_urban.auth login <nome>`.
# Em Colab / conta de outra pessoa da equipe, use a conta "default" (login padrão do ee).
accounts:
  default:
    credentials: null        # login padrão do earthengine-api (ou do gcloud, no Colab)
    max_concurrent: 4
  # para usar mais de uma conta na mesma máquina, acrescente entradas com `credentials: <arquivo>`
  # e faça o login de cada uma com: python -m mb_urban.auth login <nome>

# Destino dos assets gerados. Troque `destination` para "producao" quando entrar em produção.
destination: teste
destinations:
  teste: projects/seu-projeto-do-cloud/assets/mb_urban_col12          # pasta de testes (precisa existir)
  producao: projects/seu-projeto-do-cloud/assets/mb_urban_col12_producao

# Grades
grids:
  cartas: projects/mapbiomas-workspace/AUXILIAR/cartas        # cartas 1:250.000 (campo grid_name)
  cartas_hex: projects/ee-mburb-land/assets/LandsatCol9_Inputs/Cartas_250mil_Hex
  grid_field: grid_name
  context_buffer_m: 2        # buffer usado na Col 11 para achar as cartas vizinhas (super carta)

# Fonte do mosaico anual: "on_the_fly" (calculado a partir do Landsat) ou "asset" (pré-processado)
mosaic:
  source: on_the_fly
  asset: null                # ImageCollection com mosaicos pré-processados; vazio = <destino>/mosaicos
  single_pass: true          # mediana e percentis numa passada por coleção (mesmo resultado, menos trabalho)
  store_masked: true         # ao gravar, só dentro da máscara espacial + margem (economiza espaço)
  mask_margin_m: 180         # margem = raio do kernel de vizinhança do pré-filtro (6 px)
  # cartas de teste com mosaico gravado (as demais usam o mosaico calculado na hora)
  stored_cartas: []
  features_table: amostras_mosaico   # tabelas com os valores do mosaico nos pontos de amostra (por carta)
  encoding: col12            # col12 = sem saturação das frações/NDFI; col11 = idêntico à Col 11 (só para conferência)

# Amostras estáveis (porte de samplesCreation_v4.js + mb_batch/collections.js + visSamplesByGrid_v2.js)
samples:
  reference_collection: 10           # coleção cujo valor de classe é mantido onde há estabilidade
  stability_collections: [6, 7, 8, 9, 10]
  lulc_assets:                        # coleções integradas do MapBiomas Brasil
    6: projects/mapbiomas-public/assets/brazil/lulc/collection6/mapbiomas_collection60_integration_v1
    7: projects/mapbiomas-public/assets/brazil/lulc/collection7_1/mapbiomas_collection71_integration_v1
    8: projects/mapbiomas-public/assets/brazil/lulc/collection8/mapbiomas_collection80_integration_v1
    9: projects/mapbiomas-public/assets/brazil/lulc/collection9/mapbiomas_collection90_integration_v1
    10: projects/mapbiomas-public/assets/brazil/lulc/collection10_1/mapbiomas_brazil_collection10_1_coverage_v1
  window_start: 1985
  window_end: 2020                    # as janelas vão de ano inicial até este ano
  window_step: 8                      # 1985, 1993, 2001, 2009
  points_per_class: 250
  seed: 42
  train_fraction: 0.8
  # Tabela de amostras usada pela classificação: cópia da tabela de produção da Col 11 (mesmo sorteio com
  # sample_order: column). Para reproduzir a Col 11 pixel a pixel, use a original:
  # projects/ee-ers/assets/mapbiomas/col11/samples/stable_samples_by_range_merged_v1 com sample_order: ee_random_column
  table: projects/seu-projeto-do-cloud/assets/amostras_col11   # suba o CSV de collection 11/dados

# Classificação (porte de classification_batch_v3.js + class_lib.js)
classification:
  version: 1                          # versão do produto de probabilidade
  urban_samples: 200
  balance: 4                          # não urbano = urban_samples * balance
  sample_order: column                # column = sorteio pela coluna `random` gravada (reprodutível em qualquer cópia);
                                      # ee_random_column = randomColumn() como na Col 11 (só reproduz com a tabela original)
  training_order: sorted              # sorted = amostras ordenadas antes do treino (mesmo resultado com mosaico na hora ou gravado);
                                      # as_returned = ordem da Col 11 (só para reproduzi-la)
  trees: 120
  min_leaf_population: 5
  output: multiband                   # multiband (1 imagem por carta, todos os anos) ou per_year (Col 11)
  folder: probabilidades              # ImageCollection no destino (lida pelo pré-filtro)

# Pré-filtro e pós-processamento (porte de batchFilters.js, batchResults.js e
# spatialAndTemporalFilters.js, versões de produção da Col 11)
postprocess:
  # De onde vem a probabilidade: "classification" (saída do mb_urban.classify, pasta classification.folder)
  # ou "col11" (probabilidades da Col 11 sobre a probMean da Col 10 — reproduz a Col 11)
  probability_source: classification
  threshold_image: projects/ee-ers/assets/mapbiomas/col11/thresholdMedianByCartaImg   # banda "percentil"
  neighborhood_factor: 0.7       # pixels abaixo de 0,7 × limiar não entram na média de vizinhança
  final_factor: 0.9              # urbano = média da vizinhança >= 0,9 × limiar
  kernel_radius_px: 6
  temporal_window: 2             # média em ±2 anos
  rules:                         # remove urbano onde outra classe domina e urbano <= 20
    urban_max: 20
    water_min: 50
    veg_min: 60
    other_min: 60
  irs_asset: users/efjustiniano/IRS2023/IRS2023_v2
  irs_min: 400
  irs_last_year: 2023            # o IRS só é aplicado até este ano
  spatial_mask: projects/ee-mburb-land-c10/assets/Testes/Mask_Spatial_v9
  breakpoint_min_fraction: 0.5
  breakpoint_min_years: 5
  hole_px: 280                   # buracos < 280 px viram urbano
  noise_px: 10                   # manchas < 10 px são removidas
  cartas_export: projects/ee-mburb-land-c10/assets/Inputs/Cartas_250mil
  cartas_hex: projects/ee-mburb-land-c10/assets/Inputs/Cartas_250mil_Hex
  folder: mapa_final
  version: 1
  # Teste: processar só dentro da máscara espacial com margem (mesmo mapa final esperado). Desligado.
  mask_only: false
  mask_margin_px: 20

# Escopo das rodadas: "desenvolvimento" (cartas_teste) ou "brasil" (todas as cartas da grade hexagonal)
scope: desenvolvimento
cartas_teste:
  SF-23-Y-C: São Paulo (exemplo)

# Avaliação
evaluation:
  reference: mapbiomas_publico     # mapbiomas_publico (qualquer pessoa) ou col11 (assets internos da equipe)
  final_col11_version: C11_v6_SF
  public_reference:
    asset: projects/mapbiomas-public/assets/brazil/lulc/collection10_1/mapbiomas_brazil_collection10_1_coverage_v1
    years: [1985, 2024]
    urban_class: 24
  area_scale_m: 30
  periods: [[1985, 1992], [1993, 2000], [2001, 2008], [2009, 2025]]   # agregação da acurácia
  extra_validation:                  # pontos extras só para avaliar o início da série
    window_start: 1985
    window_end: 1992
    points_per_class: 100
    seed: 2026
    folder: validacao_extra
