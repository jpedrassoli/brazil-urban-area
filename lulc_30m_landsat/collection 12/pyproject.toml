[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mb-urban"
version = "0.1.0"
description = "MapBiomas Coleção 12 — pipeline de Áreas Urbanizadas (Landsat 30 m) no Google Earth Engine"
requires-python = ">=3.10"
dependencies = [
  "earthengine-api>=1.0",
  "pyyaml>=6",
  "pandas>=2",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
viz = ["geemap"]

[tool.setuptools]
packages = ["mb_urban"]
# A configuração (config/col12.yaml) fica fora do pacote: instale em modo editável
# (pip install -e) a partir de um clone do repositório, como faz o lançador do Colab.
